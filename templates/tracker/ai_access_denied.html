{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="card shadow-sm">
        <div class="card-body p-5">
          <div class="mb-4">
            <i class="bi bi-robot text-primary" style="font-size: 4rem;"></i>
          </div>
          <h2 class="mb-3">Unlock AI Food Logging</h2>
          <p class="text-muted mb-4">
            AI-powered food logging is available on <strong>Plus</strong> and <strong>Pro</strong> plans.
            Describe your meals in natural language or snap a photo — our AI handles the rest.
          </p>
          <div class="d-flex gap-2 justify-content-center">
            <a href="{% url 'tracker:pricing' %}" class="btn btn-primary">
              <i class="bi bi-stars me-1"></i>View Plans
            </a>
            <a href="{% url 'tracker:dashboard' %}" class="btn btn-outline-secondary">
              <i class="bi bi-arrow-left me-1"></i>Dashboard
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
